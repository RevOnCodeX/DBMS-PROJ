version: '3.8'

services:
  neo4j:
    image: neo4j:5-community
    container_name: neo4j-drone
    ports:
      - "7474:7474"   # Neo4j Browser & HTTP API
      - "7687:7687"   # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/dronepassword
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./cypher:/var/lib/neo4j/cypher_scripts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "dronepassword", "RETURN 1;"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neo4j_data:
  neo4j_logs:
